[project]
name = "ai_course_development_system"
version = "0.1.0"
description = "ai_course_development_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.24,<2.0.0",
    "flask>=3.0",
]

[project.scripts]
ai_course_development_system = "ai_course_development_system.main:run"
run_crew = "ai_course_development_system.main:run"
train = "ai_course_development_system.main:train"
replay = "ai_course_development_system.main:replay"
test = "ai_course_development_system.main:test"
run_with_trigger = "ai_course_development_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "e911ad70-5639-46ca-9065-759fe0aca29b"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
